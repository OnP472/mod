name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d $HOME
          echo "$HOME/gradle-4.9/bin" >> $GITHUB_PATH
      - name: Unzip project
        run: unzip -o netherbackport-project.zip -d project
      - name: Build
        working-directory: project
        run: gradle setupCIWorkspace build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: netherbackport-jar
          path: project/build/libs/*.jar
